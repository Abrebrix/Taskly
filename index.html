<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <div class="container">
    <header class="header wrapper__header header__1340">
      <div class="header__inner">
        <a href="index.html" class="brand header__brand">
          <span class="brand__name">Taskly</span>
          <img src="img/logo.svg" alt="Логотип Taskly">
        </a>
      </div>
    </header>
    <main class="welcome">
      <div class="container">
        <div class="welcome__inner">

          <h1 class="welcome__title">Taskly</h1>
          <h2 class="welcome__subtitle">Пространство для заметок и идей</h2>

          <div class="auth-options">
            <a href="registration.html" class="auth-options__card auth-options__card--reg">
              <h2 class="auth-options__title">Продолжить с регистрацией</h2>

              <ul class="auth-options__list">
                <li class="auth-options__item">Почта</li>
                <li class="auth-options__item">Пароль</li>
              </ul>
            </a>

            <a href="app.html" class="auth-options__card auth-options__card--guest">
              <h3 class="auth-options__title">Без регистрации</h3>

              <p class="auth-options__text">Ты можешь потерять свои заметки</p>
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
